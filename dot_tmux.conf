# Mix of own config + omarchy (basecamp/omarchy config/tmux/tmux.conf)
# Prefix: C-a (C-Space and C-b also work). Cheatsheet: prefix + ? or /

# ---- Prefix ----
unbind C-b
set -g prefix C-a
set -g prefix2 C-Space
bind -N "Send prefix" C-a send-prefix

# ---- General ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -sg escape-time 10
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys,xterm-kitty:extkeys,*:clipboard"

# Shift/Alt+Enter send a raw linefeed
bind -N "Newline (Shift+Enter)" -n S-Enter send-keys C-v C-j
bind -N "Newline (Alt+Enter)" -n M-Enter send-keys C-v C-j

# ---- Copy mode (vi, Wayland) ----
setw -g mode-keys vi
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- Panes ----
bind -N "Focus pane left" -n M-h select-pane -L
bind -N "Focus pane down" -n M-j select-pane -D
bind -N "Focus pane up" -n M-k select-pane -U
bind -N "Focus pane right" -n M-l select-pane -R
bind -N "Split left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" - split-window -v -c "#{pane_current_path}"
bind -N "Split left/right" v split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom" h split-window -v -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane
bind -N "Kill pane" -n M-Escape kill-pane
unbind '"'
unbind %
bind -N "Resize pane Left" -n C-M-S-Left  resize-pane -L 5
bind -N "Resize pane Down" -n C-M-S-Down  resize-pane -D 5
bind -N "Resize pane Up" -n C-M-S-Up    resize-pane -U 5
bind -N "Resize pane Right" -n C-M-S-Right resize-pane -R 5

# ---- Windows ----
bind -N "Previous window" b previous-window
bind -N "Next window" n next-window
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window
bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9
bind -N "Previous window" -n M-Left  select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# ---- Sessions ----
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "New session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up   switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# ---- Misc ----
bind -N "Reload config" r source-file "#{current_file}" \; display-message "Config reloaded from #{current_file}!"
bind -N "ML dashboard (shell + nvitop)" M-m split-window -h -c "#{pane_current_path}" "uvx nvitop" \; select-pane -L
# Cheatsheet is generated from the -N notes above
bind -N "Show keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "bash -c '{ echo PREFIX C-a:; tmux list-keys -N; echo; echo NO PREFIX:; tmux list-keys -N -T root; } | less -R'"
bind / display-popup -E -w 80% -h 70% -T "Tmux keybindings" "bash -c '{ echo PREFIX C-a:; tmux list-keys -N; echo; echo NO PREFIX:; tmux list-keys -N -T root; } | less -R'"

# ---- Status bar (omarchy theme, transparent) ----
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h #[fg=cyan]%H:%M #[fg=white]%d-%b "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
