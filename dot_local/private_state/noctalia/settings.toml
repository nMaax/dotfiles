config_version = 12

[bar.default]
center = [ "media", "cat" ]
contact_shadow = true
end = [ "tray", "volume", "brightness", "battery", "control-center" ]
font_family = "SF Pro"
margin_ends = 0
position = "left"
start = [ "clock", "workspaces" ]

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "full"

    [control_center.calendar]
    show_week_numbers = true

[dock]
auto_hide = true
background_opacity = 0.99999997764825821
enabled = true
position = "right"
reserve_space = false
show_dots = true

[hot_corners]
delay_ms = 200
enabled = true

    [hot_corners.top_left]
    action = "window_switcher"

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 1280.0
    cy = 1241.5
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "hyprland"
hyprland_lua_config = "~/.config/hypr/cheatsheet.lua"
hyprland_parser = "lua"
show_undescribed = false

[plugins]
enabled = [ "noctalia/kaomoji", "noctalia/mpvpaper", "tadomika_ari/w-engine", "kenn/keybind-cheatsheet" ]

[shell]
button_borders = false
card_borders = false
font_family = "SF Pro"
input_borders = false
lang = "en"
popup_borders = false
screen_time_enabled = true
settings_show_advanced = false
telemetry_enabled = true

    [shell.animation]
    speed = 1.4000000208616257

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    wallpaper_placement = "floating"
    wallpaper_position = "top_center"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/massimiliano/Pictures/Screenshots"

    [shell.shadow]
    direction = "down_left"

[theme]
builtin = "Rosé Pine"
community_palette = "Heartbox"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt", "starship" ]
    community_ids = [ "spicetify", "neovim", "heroiclauncher", "prismlauncher", "yazi" ]

[wallpaper]
directory = "/home/massimiliano/Pictures/Wallpapers"
transition = [ "disc", "honeycomb", "stripes", "wipe" ]
