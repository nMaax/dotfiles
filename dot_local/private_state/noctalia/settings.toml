config_version = 8

[bar.default]
center = [ "media" ]
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "SF Pro"
position = "left"
start = [ "cat", "clock", "workspaces" ]

[brightness]
enable_ddcutil = true

[control_center.calendar]
show_week_numbers = true

[dock]
enabled = false

[hot_corners]
enabled = true

    [hot_corners.top_left]
    action = "window_switcher"

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 1280.0
    cy = 1241.5
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[plugins]
enabled = [ "noctalia/kaomoji", "noctalia/mpvpaper", "noctalia/bongocat", "tadomika_ari/w-engine", "kenn/keybind-cheatsheet" ]

[shell]
app_icon_colorize = true
font_family = "SF Pro"
lang = "en"
screen_time_enabled = true
settings_show_advanced = false
telemetry_enabled = true

    [shell.animation]
    speed = 1.2500000186264515

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "top_center"

    [shell.screen_corners]
    enabled = true

    [shell.shadow]
    direction = "down_left"

[theme]
builtin = "Noctalia"
community_palette = "Garnet"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "hyprland" ]

[wallpaper]
directory = "/home/massimiliano/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/massimiliano/Pictures/Wallpapers/sora-drive.jpg"

    [wallpaper.last]
    path = "/home/massimiliano/Pictures/Wallpapers/sora-drive.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/massimiliano/Pictures/Wallpapers/sora-drive.jpg"

[weather]
enabled = false

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.media]
hide_when_no_media = true