[auto_approve]
commands = [
  # --- Python & Environment Management ---
  "uv run pyright*",
  "uv run pre-commit*",
  "uv run pytest*",
  "uv run ruff*",
  "uv run mypy*",
  "uv run black*",
  "uv run flake8*",

  # --- Git (Read-Only / Information Gathering) ---
  "git status*",
  "git diff*",
  "git log*",
  "git branch*",
  "git show*",

  # --- File Inspection & Search ---
  "ls*",
  "dir*",
  "pwd*",
  "cat*",
  "head*",
  "tail*",
  "grep*",
  "rg*",      # ripgrep
  "fd*",      # fd-find
  "find*",

  # --- System & Environment Info ---
  "python --version*",
  "node --version*",
  "uv --version*",
  "git --version*",
  "which*",
  "where*"
]
