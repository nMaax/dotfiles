# Foot terminal configuration
# See `man 5 foot.ini` for available options.

[main]
include=~/.config/foot/themes/noctalia

# Fonts: text, then a text-symbol fallback, then Apple emoji (matches Ghostty)
font=JetBrainsMono Nerd Font:size=12, DejaVu Sans Mono:size=12, Apple Color Emoji:size=12

# Padding between border and glyphs: XxY (matches Ghostty's 12x10)
pad=12x10 center
