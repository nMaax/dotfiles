# Gaming shader-cache configuration — managed by chezmoi.
# Each driver ignores the other vendor's variables, so both are always set.

# NVIDIA: 12 GB shader disk-cache, never auto-cleaned
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# Mesa (AMD/Intel): 12 GB shader cache
MESA_SHADER_CACHE_MAX_SIZE=12G
