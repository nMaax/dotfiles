# Gaming environment — managed by chezmoi.
# Each driver ignores the other vendor's variables, so both are always set.

# NVIDIA: 12 GB shader disk-cache, never auto-cleaned
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# Mesa (AMD/Intel): 12 GB shader cache
MESA_SHADER_CACHE_MAX_SIZE=12G

# Proton-CachyOS only (ignored by Valve's Proton): upgrade DLSS DLLs, 64-bit NVIDIA libs
PROTON_DLSS_UPGRADE=1
PROTON_NVIDIA_LIBS_NO_32BIT=1

# NVIDIA (any Proton): newest DLSS via the driver's NGX updater, overriding games' DLSS presets
PROTON_ENABLE_NGX_UPDATER=1
DXVK_NVAPI_DRS_NGX_DLSS_SR_OVERRIDE=on
DXVK_NVAPI_DRS_NGX_DLSS_SR_OVERRIDE_RENDER_PRESET_SELECTION=render_preset_latest
DXVK_NVAPI_DRS_NGX_DLSS_RR_OVERRIDE=on
DXVK_NVAPI_DRS_NGX_DLSS_RR_OVERRIDE_RENDER_PRESET_SELECTION=render_preset_latest
DXVK_NVAPI_DRS_NGX_DLSS_FG_OVERRIDE=on

# Hide DXVK's HUD (e.g. the "Compiling shaders" notice)
DXVK_HUD=0
